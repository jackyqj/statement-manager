version: '3.8'

services:
  # Development service
  statement-manager-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: statement-manager-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - statement-manager-network
    profiles:
      - dev

  # Production service
  statement-manager-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: statement-manager-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - statement-manager-network
    profiles:
      - prod

  # Development with hot reload (alternative)
  statement-manager-hot:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: statement-manager-hot
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - statement-manager-network
    profiles:
      - hot

networks:
  statement-manager-network:
    driver: bridge 