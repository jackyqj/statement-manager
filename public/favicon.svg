<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20c997;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)" filter="url(#dropShadow)"/>
  
  <!-- Main document/statement icon -->
  <g transform="translate(16, 12)">
    <!-- Document base -->
    <rect x="0" y="0" width="32" height="40" rx="4" ry="4" fill="url(#iconGradient)" stroke="#e9ecef" stroke-width="1"/>
    
    <!-- Document fold -->
    <polygon points="0,0 8,0 8,8 0,8" fill="#dee2e6"/>
    
    <!-- Lines representing text -->
    <rect x="4" y="12" width="20" height="2" rx="1" fill="#6c757d"/>
    <rect x="4" y="16" width="16" height="2" rx="1" fill="#6c757d"/>
    <rect x="4" y="20" width="18" height="2" rx="1" fill="#6c757d"/>
    <rect x="4" y="24" width="14" height="2" rx="1" fill="#6c757d"/>
    <rect x="4" y="28" width="22" height="2" rx="1" fill="#6c757d"/>
    <rect x="4" y="32" width="12" height="2" rx="1" fill="#6c757d"/>
    
    <!-- Financial chart icon overlay -->
    <g transform="translate(4, 8)">
      <!-- Chart line -->
      <path d="M0,8 L4,4 L8,6 L12,2 L16,5 L20,1 L24,3" 
            stroke="url(#accentGradient)" 
            stroke-width="2" 
            fill="none" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      
      <!-- Chart dots -->
      <circle cx="0" cy="8" r="1.5" fill="url(#accentGradient)"/>
      <circle cx="4" cy="4" r="1.5" fill="url(#accentGradient)"/>
      <circle cx="8" cy="6" r="1.5" fill="url(#accentGradient)"/>
      <circle cx="12" cy="2" r="1.5" fill="url(#accentGradient)"/>
      <circle cx="16" cy="5" r="1.5" fill="url(#accentGradient)"/>
      <circle cx="20" cy="1" r="1.5" fill="url(#accentGradient)"/>
      <circle cx="24" cy="3" r="1.5" fill="url(#accentGradient)"/>
    </g>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.1">
    <circle cx="12" cy="12" r="2" fill="white"/>
    <circle cx="52" cy="52" r="3" fill="white"/>
    <circle cx="48" cy="16" r="1.5" fill="white"/>
  </g>
  
  <!-- Glossy highlight -->
  <ellipse cx="24" cy="20" rx="8" ry="4" fill="white" opacity="0.3"/>
</svg> 