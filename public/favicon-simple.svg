<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)"/>
  
  <!-- Document icon -->
  <g transform="translate(20, 16)">
    <!-- Document base -->
    <rect x="0" y="0" width="24" height="32" rx="3" ry="3" fill="url(#iconGradient)" stroke="#e9ecef" stroke-width="1"/>
    
    <!-- Document fold -->
    <polygon points="0,0 6,0 6,6 0,6" fill="#dee2e6"/>
    
    <!-- Dollar sign -->
    <text x="12" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#28a745">$</text>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="16" cy="16" r="2" fill="white" opacity="0.3"/>
  <circle cx="48" cy="48" r="2" fill="white" opacity="0.3"/>
</svg> 